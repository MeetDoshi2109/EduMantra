<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduMantra – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; }
    .auth-tab { flex: 1; text-align: center; padding: .6rem; border: none; background: none;
      font-weight: 500; color: var(--text-secondary); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .18s, border-color .18s; }
    .auth-tab.active { color: var(--primary); border-color: var(--primary); }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: 1rem; }
    .role-option { border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: .5rem .4rem; text-align: center; cursor: pointer; font-size: .78rem;
      transition: border-color .18s, background .18s; }
    .role-option:hover { border-color: var(--primary); background: var(--primary-light); }
    .role-option.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .role-option .role-icon { font-size: 1.3rem; display: block; margin-bottom: .25rem; }
    .divider { text-align: center; color: var(--text-muted); font-size: .8rem;
      margin: 1rem 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute;
      top: 50%; width: 42%; height: 1px; background: var(--border); }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="width:52px;height:52px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.3rem;margin:0 auto .5rem">EM</div>
      <h1>EduMantra</h1>
      <p>AI-Enabled Skill Intelligence & Learning Platform</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login -->
    <div class="auth-panel active" id="panel-login">
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="you@gov.in" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
        <p class="text-sm text-muted mt-1 text-right">
          <a href="#" onclick="showForgot()" style="color:var(--primary)">Forgot password?</a>
        </p>
      </form>
    </div>

    <!-- Register -->
    <div class="auth-panel" id="panel-register">
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" placeholder="you@gov.in" required>
        </div>
        <div class="form-group">
          <label>Password (min 8 characters)</label>
          <input type="password" id="reg-password" placeholder="••••••••" required minlength="8">
        </div>
        <div class="form-group">
          <label>Select Role</label>
          <div class="role-grid" id="roleGrid">
            <div class="role-option" data-role="student" onclick="selectRole(this)">
              <span class="role-icon">🎓</span>Student
            </div>
            <div class="role-option" data-role="instructor" onclick="selectRole(this)">
              <span class="role-icon">👨‍🏫</span>Instructor
            </div>
            <div class="role-option" data-role="parent" onclick="selectRole(this)">
              <span class="role-icon">👨‍👩‍👧</span>Parent
            </div>
            <div class="role-option" data-role="organization_admin" onclick="selectRole(this)">
              <span class="role-icon">🏛️</span>Org Admin
            </div>
            <div class="role-option" data-role="developer" onclick="selectRole(this)">
              <span class="role-icon">💻</span>Developer
            </div>
          </div>
          <input type="hidden" id="reg-role" required>
        </div>
        <div class="form-group">
          <label>Designation (optional)</label>
          <input type="text" id="reg-designation" placeholder="e.g. Statistical Officer">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
      </form>
    </div>

    <!-- Forgot Password -->
    <div class="auth-panel" id="panel-forgot">
      <form id="forgotForm">
        <p class="text-sm text-muted mb-2">Enter your email to receive a password reset link.</p>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="forgot-email" placeholder="you@gov.in" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
        <p class="text-sm mt-1 text-right">
          <a href="#" onclick="switchTab('login')" style="color:var(--primary)">Back to login</a>
        </p>
      </form>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) {
    const u = Auth.getUser();
    if (u) Auth.redirectByRole(u);
  }

  let selectedRole = '';

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', ['login','register'][i] === tab);
    });
    document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`panel-${tab}`)?.classList.add('active');
  }

  function showForgot() {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-forgot').classList.add('active');
  }

  function selectRole(el) {
    document.querySelectorAll('.role-option').forEach(r => r.classList.remove('selected'));
    el.classList.add('selected');
    selectedRole = el.dataset.role;
    document.getElementById('reg-role').value = selectedRole;
  }

  // Login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Signing in…'; btn.disabled = true;
    try {
      const data = await Api.post('/auth/login', {
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      });
      Auth.save(data);
      Toast.success('Welcome back, ' + data.user.full_name);
      setTimeout(() => Auth.redirectByRole(data.user), 500);
    } catch (err) {
      Toast.error(err.message);
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
  });

  // Register
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedRole) { Toast.error('Please select a role'); return; }
    const btn = document.getElementById('registerBtn');
    btn.textContent = 'Creating account…'; btn.disabled = true;
    try {
      await Api.post('/auth/register', {
        full_name:   document.getElementById('reg-name').value,
        email:       document.getElementById('reg-email').value,
        password:    document.getElementById('reg-password').value,
        role:        selectedRole,
        designation: document.getElementById('reg-designation').value,
      });
      Toast.success('Account created! Please sign in.');
      switchTab('login');
    } catch (err) {
      Toast.error(err.message);
    } finally {
      btn.textContent = 'Create Account'; btn.disabled = false;
    }
  });

  // Forgot password
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await Api.post('/auth/forgot-password', {
        email: document.getElementById('forgot-email').value,
      });
      Toast.success('Reset link sent! Check your email.');
    } catch (err) {
      Toast.error(err.message);
    }
  });
</script>
</body>
</html>
